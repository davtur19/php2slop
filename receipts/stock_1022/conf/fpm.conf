[global]
pid = /tmp/opencode/research/stock_20261022T013022Z/run/php-fpm.pid
error_log = /tmp/opencode/research/stock_20261022T013022Z/log/fpm-error.log
log_level = notice
daemonize = yes
process_control_timeout = 10

[mage]
