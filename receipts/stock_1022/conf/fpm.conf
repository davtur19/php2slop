group = davide
listen = /tmp/opencode/research/stock_20261022T013022Z/run/php-fpm.sock
listen.mode = 0660
pm = static
pm.max_children = 1
pm.max_requests = 0
catch_workers_output = yes
access.log = /tmp/opencode/research/stock_20261022T013022Z/log/fpm-access.log
access.format = "%p|%d|%t|%m|%s"
php_admin_value[error_log] = /tmp/opencode/research/stock_20261022T013022Z/log/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = 32767
php_value[memory_limit] = 512M
php_value[post_max_size] = 8M
php_value[upload_max_filesize] = 8M
php_value[max_execution_time] = 120
php_value[max_input_time] = 120
php_value[session.serialize_handler] = php
php_value[session.use_strict_mode] = 0
php_value[session.upload_progress.enabled] = 1
php_value[session.upload_progress.cleanup] = 0
php_value[session.upload_progress.freq] = 1
php_value[session.upload_progress.min_freq] = 0
php_value[session.save_path] = /tmp/opencode/research/stock_20261022T013022Z/www/var/session
php_value[default_socket_timeout] = 60
