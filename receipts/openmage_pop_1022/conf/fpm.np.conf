[global]
pid = /tmp/opencode/research/openmage_pop_20261022T021222Z/run/fpm_np.pid
error_log = /tmp/opencode/research/openmage_pop_20261022T021222Z/log/fpm_np.error.log
log_level = notice
daemonize = yes
process_control_timeout = 10
emergency_restart_threshold = 0

; Reader pool: the stock OpenMage application. NO session.* / upload_progress.*
; overrides -> PHP defaults (serialize_handler=php, upload_progress.cleanup=On).
[app_np]
user = davide
group = davide
listen = /tmp/opencode/research/openmage_pop_20261022T021222Z/run/app_np.sock
listen.mode = 0660
pm = static
pm.max_children = 2
pm.max_requests = 0
catch_workers_output = yes
access.log = /tmp/opencode/research/openmage_pop_20261022T021222Z/log/fpm_np.access.log
access.format = "%p|%d|%t|%m|%s"
php_admin_value[error_log] = /tmp/opencode/research/openmage_pop_20261022T021222Z/log/php_np.error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = 32767
php_value[memory_limit] = 512M
php_value[post_max_size] = 16M
php_value[upload_max_filesize] = 16M
php_value[max_execution_time] = 120
php_value[max_input_time] = 120
php_value[default_socket_timeout] = 60

; Writer pool (deployment delta: php_serialize writer, shared save_path).
; upload_progress.cleanup is left at the PHP default (On).
[writer_np]
user = davide
group = davide
listen = /tmp/opencode/research/openmage_pop_20261022T021222Z/run/writer_np.sock
listen.mode = 0660
pm = static
pm.max_children = 2
pm.max_requests = 0
catch_workers_output = yes
access.log = /tmp/opencode/research/openmage_pop_20261022T021222Z/log/fpm_np.access.log
access.format = "%p|%d|%t|%m|%s|w"
php_admin_value[error_log] = /tmp/opencode/research/openmage_pop_20261022T021222Z/log/php_np.error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = 32767
php_value[memory_limit] = 256M
php_value[post_max_size] = 16M
php_value[upload_max_filesize] = 16M
php_value[max_execution_time] = 120
php_value[max_input_time] = 120
php_value[session.serialize_handler] = php_serialize
php_value[session.save_path] = /tmp/opencode/research/openmage_pop_20261022T021222Z/www/var/session
php_value[session.use_strict_mode] = 0

; Control pool: stock php writer, same save_path. Shows the delimiter rejection.
[writer_stock_np]
user = davide
group = davide
listen = /tmp/opencode/research/openmage_pop_20261022T021222Z/run/writer_stock_np.sock
listen.mode = 0660
pm = static
pm.max_children = 1
pm.max_requests = 0
catch_workers_output = yes
access.log = /tmp/opencode/research/openmage_pop_20261022T021222Z/log/fpm_np.access.log
access.format = "%p|%d|%t|%m|%s|s"
php_admin_value[error_log] = /tmp/opencode/research/openmage_pop_20261022T021222Z/log/php_np.error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = 32767
php_value[memory_limit] = 256M
php_value[post_max_size] = 16M
php_value[upload_max_filesize] = 16M
php_value[max_execution_time] = 120
php_value[max_input_time] = 120
php_value[session.save_path] = /tmp/opencode/research/openmage_pop_20261022T021222Z/www/var/session
php_value[session.use_strict_mode] = 0
