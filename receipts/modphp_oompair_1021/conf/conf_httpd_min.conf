# conf_httpd_min.conf — redeploy of the modphp_lab minimal conf for the
# CVE-2026-109618/109619 mod_php redo session (scratch copy; the lab originals
# under /tmp/opencode/modphp_lab/ are NOT edited). Structural diff vs the lab
# conf: only log/session/docroot paths -> this scratch dir, and the memory_limit
# lane is set to the FPM-receipt-validated value (8M).
# Source of the %P CustomLog format: lab conf [mod-5 edit-1] (kept byte-identical).

Listen 28850
ServerName 127.0.0.1
PidFile  /tmp/opencode/modphp_redo_1021/httpd.pid
ErrorLog /tmp/opencode/modphp_redo_1021/logs/err.log
LogLevel warn

DocumentRoot /tmp/opencode/modphp_redo_1021/htdocs

User davide
Group davide

LoadModule php_module /tmp/opencode/apache/modules/libphp.so
LoadModule log_config_module /tmp/opencode/apache/modules/mod_log_config.so
LoadModule unixd_module /tmp/opencode/apache/modules/mod_unixd.so
LoadModule dir_module /tmp/opencode/apache/modules/mod_dir.so
LoadModule authn_core_module /tmp/opencode/apache/modules/mod_authn_core.so
LoadModule authz_core_module /tmp/opencode/apache/modules/mod_authz_core.so
LoadModule authz_user_module /tmp/opencode/apache/modules/mod_authz_user.so
LoadModule auth_basic_module /tmp/opencode/apache/modules/mod_auth_basic.so

<Directory /tmp/opencode/modphp_redo_1021/htdocs>
    Require all granted
</Directory>

# %P = pid of the httpd child (prefork worker) that serviced the request.
# Pairing proof for deliverable 3: producer vs consumer lines end in the same %P.
CustomLog /tmp/opencode/modphp_redo_1021/access.log "%h %l %u %t \"%r\" %>s %b %D %P"

<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php

php_value session.save_path /tmp/opencode/modphp_redo_1021/sessions
php_admin_flag  log_errors on
php_admin_value error_log /tmp/opencode/modphp_redo_1021/logs/php_err.log
# keep machinery records on disk after completion (PHP_INI_ALL) -> the rfc1867
# decoder then re-READS a stored attacker-shaped record pre-init on every
# machinery request (CVE-2026-109619 consumption shape; setup mirrors the
# commented lab admin block).
php_value session.upload_progress.cleanup 0

# FPM-receipt parity (diag3/diag4, validation_1021_filmpost.md):
# php_admin_value[memory_limit]=8M in fpm_realapps.conf produced
#   "Allowed memory size of 8388608 bytes exhausted (tried to allocate 266240 bytes)"
# during pre-RINIT multipart machinery. 8M here for the same shape.
php_value memory_limit 8M
# (the lab run had also validated the tighter lane: php_value memory_limit 2M)
