daemon on;
worker_processes 1;
pid /tmp/opencode/research/php8pie_20261022_0325/run/nginx.pid;
error_log /tmp/opencode/research/php8pie_20261022_0325/log/nginx-error.log info;
events { worker_connections 256; }
http {
  access_log /tmp/opencode/research/php8pie_20261022_0325/log/nginx-access.log;
  client_max_body_size 128m;
  client_body_buffer_size 1m;
  server {
    listen 127.0.0.1:28931;
    server_name localhost;
    root /tmp/opencode/research/php8pie_20261022_0325/www;
    index info.php;
    location /sess/ { autoindex off; }
    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:28933;
      fastcgi_index info.php;
      include /opt/nginx-1.30.1/conf/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_request_buffering off;
      fastcgi_read_timeout 60s;
    }
  }
}
