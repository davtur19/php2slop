[global]
pid = /tmp/opencode/research/drupal_fpm_20261022T013000Z/run/php-fpm.pid
error_log = /tmp/opencode/research/drupal_fpm_20261022T013000Z/log/fpm-error.log
daemonize = yes
log_level = notice
process_control_timeout = 5s

[www]
listen = /tmp/opencode/research/drupal_fpm_20261022T013000Z/run/php-fpm-drupal.sock
listen.mode = 0666
user = davide
group = davide
pm = static
pm.max_children = 1
pm.max_requests = 0
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
request_terminate_timeout = 120s
php_admin_value[memory_limit] = 512M
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[max_input_time] = 120
php_admin_value[max_execution_time] = 120
php_admin_value[precision] = 11
php_admin_value[error_reporting] = 32767
php_admin_value[display_errors] = 1
php_admin_value[display_startup_errors] = 1
php_admin_value[log_errors] = 1
php_admin_value[error_log] = /tmp/opencode/research/drupal_fpm_20261022T013000Z/log/drupal-php-error.log
php_admin_value[opcache.enable] = 0

[lab]
listen = /tmp/opencode/research/drupal_fpm_20261022T013000Z/run/php-fpm-lab.sock
listen.mode = 0666
user = davide
group = davide
pm = static
pm.max_children = 1
pm.max_requests = 0
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
request_terminate_timeout = 120s
php_admin_value[memory_limit] = 2M
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[max_input_time] = 120
php_admin_value[max_execution_time] = 120
php_admin_value[precision] = 11
php_admin_value[error_reporting] = 32767
php_admin_value[display_errors] = 1
php_admin_value[display_startup_errors] = 1
php_admin_value[log_errors] = 1
php_admin_value[error_log] = /tmp/opencode/research/drupal_fpm_20261022T013000Z/log/lab-php-error.log
php_admin_value[opcache.enable] = 0
php_admin_value[unserialize_max_depth] = 20000
