access.log = /tmp/opencode/nginx_mitigation_1021/logs/fpm_n1.access.log
access.format = "pid=%p %R %m %r%Q%q -> %s %{mili}dms"
php_admin_value[memory_limit] = 128M
php_admin_value[session.save_path] = /tmp/opencode/nginx_mitigation_1021/sessions/n1
php_admin_value[error_log] = /tmp/opencode/nginx_mitigation_1021/logs/fpm_n1.error.log
php_admin_flag[log_errors] = on
php_admin_value[display_errors] = On

