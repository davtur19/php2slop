[global]
pid = /tmp/opencode/nginx_mitigation_1021/run/php-fpm.pid
error_log = /tmp/opencode/nginx_mitigation_1021/logs/php-fpm-master.log
daemonize = yes
log_level = notice

; ---- N0: control (no edge cap, PHP memory_limit 8M) ----
[n0]
listen = /tmp/opencode/nginx_mitigation_1021/run/fpm_n0.sock
listen.mode = 0666
user = davide
group = davide
pm = static
pm.max_children = 4
pm.max_requests = 500
request_terminate_timeout = 60s
catch_workers_output = yes
access.log = /tmp/opencode/nginx_mitigation_1021/logs/fpm_n0.access.log
access.format = "pid=%p %R %m %r%Q%q -> %s %{mili}dms"
php_admin_value[memory_limit] = 8M
php_admin_value[session.save_path] = /tmp/opencode/nginx_mitigation_1021/sessions/n0
php_admin_value[error_log] = /tmp/opencode/nginx_mitigation_1021/logs/fpm_n0.error.log
php_admin_flag[log_errors] = on
php_admin_value[display_errors] = On

; ---- N1: edge cap 2m + PHP headroom 128M ----
[n1]
listen = /tmp/opencode/nginx_mitigation_1021/run/fpm_n1.sock
listen.mode = 0666
user = davide
group = davide
pm = static
pm.max_children = 4
