# /tmp/opencode/nginx_mitigation_1021/conf/nginx.conf
# Edge (nginx 1.30.1) mitigation lanes for the PHP 8.5.10 upload-progress OOM arm.
# loopback only, ports 29000-29007.
worker_processes 1;
worker_rlimit_nofile 1024;
pid /tmp/opencode/nginx_mitigation_1021/run/nginx.pid;
error_log /tmp/opencode/nginx_mitigation_1021/logs/nginx-error.log info;

events { worker_connections 256; }

http {
    include /opt/nginx-1.30.1/conf/mime.types;
    default_type application/octet-stream;
    access_log off;
    log_format lane '$time_iso8601 port=$server_port $remote_addr "$request_method $request_uri" '
                    'status=$status sent=$body_bytes_sent req_len=$request_length '
                    'upst=$upstream_status ct=$request_time cl=$content_length';

    client_body_temp_path /tmp/opencode/nginx_mitigation_1021/run/client_body;
    proxy_temp_path       /tmp/opencode/nginx_mitigation_1021/run/proxy_temp;
    fastcgi_temp_path     /tmp/opencode/nginx_mitigation_1021/run/fastcgi_temp;

    # N4 zones (signature-independent cost raising)
    limit_req_zone  $binary_remote_addr zone=n4post:1m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=n4conn:1m;

    # sweep lane: per-request PHP memory_limit (measurement only)
    map $http_x_php_mem $php_mem_ini {
        default "memory_limit=$http_x_php_mem";
        ""      "";
    }

    upstream shim_up { server 127.0.0.1:29006; }

    # ---------------- N0 control: no edge cap, PHP memory_limit=8M ----------------
    server {
        listen 127.0.0.1:29000;
        server_name n0;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/n0.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/n0.error.log info;
        client_max_body_size 8m;          # == post_max_size, lets the 4.98MB arm in
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_n0.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- N1 edge cap 2m + PHP headroom 128M ----------------
    server {
        listen 127.0.0.1:29001;
        server_name n1;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/n1.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/n1.error.log info;
        client_max_body_size 2m;
        client_body_buffer_size 1m;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_n1.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- N2 edge cap 2m, no headroom (8M) ----------------
    server {
        listen 127.0.0.1:29002;
        server_name n2;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/n2.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/n2.error.log info;
        client_max_body_size 2m;
        client_body_buffer_size 1m;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_n2.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- N4 cap 2m + limit_req/limit_conn ----------------
    server {
        listen 127.0.0.1:29004;
        server_name n4;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/n4.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/n4.error.log info;
        client_max_body_size 2m;
        client_body_buffer_size 1m;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location = /sleep.php {
            # limit_conn only: concurrency limb, measured separately from limit_req
            limit_conn n4conn 5;
            limit_conn_status 429;
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_n4.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
        location ~ \.php$ {
            limit_req zone=n4post burst=5 nodelay;
            limit_req_status 429;
            limit_conn n4conn 5;
            limit_conn_status 429;
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_n4.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- sweep: per-request memory_limit for headroom curve ----------------
    server {
        listen 127.0.0.1:29005;
        server_name sweep;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/sweep.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/sweep.error.log info;
        client_max_body_size 0;           # no edge cap: we are measuring PHP, not the edge
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_sweep.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PHP_VALUE $php_mem_ini;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- N3 upstream (only reachable through the reference shim) ----------------
    server {
        listen 127.0.0.1:29006;
        server_name n3up;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/n3up.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/n3up.error.log info;
        client_max_body_size 0;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_n3.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- N3-core-approx: prove `if ($request_body ...)` cannot work ----------------
    server {
        listen 127.0.0.1:29007;
        server_name n3core;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/n3core.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/n3core.error.log info;
        client_max_body_size 0;
        client_body_buffer_size 1m;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            # core-only attempt at a body-token rule (expected: never fires, $request_body
            # is not populated at rewrite-phase time)
            if ($request_body ~ "PHP_SESSION_UPLOAD_PROGRESS") {
                return 403;
            }
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_n3.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- shape lane: small-body grammar / .user.ini tests (8M) ----------------
    server {
        listen 127.0.0.1:29009;
        server_name shape;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/shape.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/shape.error.log info;
        client_max_body_size 8m;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_shape.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- fresh-worker probe lane (pm.max_requests=1, 8M default) ----------------
    server {
        listen 127.0.0.1:29010;
        server_name fresh;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/fresh.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/fresh.error.log info;
        client_max_body_size 0;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_fresh.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PHP_VALUE $php_mem_ini;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- warm single-worker lane (steady-state heap) ----------------
    server {
        listen 127.0.0.1:29011;
        server_name warm;
        root /tmp/opencode/nginx_mitigation_1021/docroot;
        access_log /tmp/opencode/nginx_mitigation_1021/logs/warm.access.log lane;
        error_log  /tmp/opencode/nginx_mitigation_1021/logs/warm.error.log info;
        client_max_body_size 0;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/nginx_mitigation_1021/run/fpm_warm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PHP_VALUE $php_mem_ini;
            fastcgi_read_timeout 60s;
        }
    }
}
