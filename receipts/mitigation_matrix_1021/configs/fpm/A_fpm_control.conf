; A_fpm_control - private pool for the 2026-10-21 mitigation matrix.
; Generated by scripts/make_configs.py; do not hand-edit.
[global]
pid = /tmp/opencode/mitigation_1021/lanes/A_fpm_control/run/fpm.pid
error_log = /tmp/opencode/mitigation_1021/lanes/A_fpm_control/logs/fpm.log
log_level = notice
daemonize = no
process_control_timeout = 5

[a]
user = davide
group = davide
listen = 127.0.0.1:28980
listen.allowed_clients = 127.0.0.1
pm = static
pm.max_children = 1
pm.max_requests = 0
catch_workers_output = yes
access.log = /tmp/opencode/mitigation_1021/lanes/A_fpm_control/logs/access.log
access.format = "%p|%d|%t|%m|%s|%l"
php_admin_value[error_log] = /tmp/opencode/mitigation_1021/lanes/A_fpm_control/logs/php_err.log
php_admin_flag[log_errors] = on
php_admin_value[display_errors] = 1
php_admin_value[fatal_error_backtraces] = 1
php_admin_value[session.save_path] = /tmp/opencode/mitigation_1021/lanes/A_fpm_control/sessions
php_admin_value[session.upload_progress.enabled] = 1
php_admin_value[session.upload_progress.cleanup] = 0
php_admin_value[session.use_strict_mode] = 0
php_admin_value[session.use_only_cookies] = 1
php_admin_value[session.gc_probability] = 0
php_admin_value[memory_limit] = 8M
php_admin_value[post_max_size] = 8M
php_admin_value[upload_tmp_dir] = /tmp/opencode/mitigation_1021/lanes/A_fpm_control/tmp
php_admin_value[sys_temp_dir] = /tmp/opencode/mitigation_1021/lanes/A_fpm_control/tmp
