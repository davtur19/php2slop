# mitmD.conf - private httpd 2.4.66 + mod_php 8.5.10 (libphp.so) on 127.0.0.1:28982
# Lane D of the 2026-10-21 mitigation matrix. Own conf copy; the :28850 lab
# conf under /tmp/opencode/modphp_redo_1021 is NOT touched.
Listen 127.0.0.1:28982
ServerName 127.0.0.1
PidFile /tmp/opencode/mitigation_1021/lanes/D_modphp/run/httpd.pid
ErrorLog /tmp/opencode/mitigation_1021/lanes/D_modphp/logs/err.log
LogLevel warn
ServerLimit 1
StartServers 1
MaxRequestWorkers 1
MaxConnectionsPerChild 0

LoadModule php_module /tmp/opencode/apache/modules/libphp.so
LoadModule log_config_module /tmp/opencode/apache/modules/mod_log_config.so
LoadModule unixd_module /tmp/opencode/apache/modules/mod_unixd.so
LoadModule dir_module /tmp/opencode/apache/modules/mod_dir.so
LoadModule authn_core_module /tmp/opencode/apache/modules/mod_authn_core.so
LoadModule authz_core_module /tmp/opencode/apache/modules/mod_authz_core.so
LoadModule authz_user_module /tmp/opencode/apache/modules/mod_authz_user.so
LoadModule auth_basic_module /tmp/opencode/apache/modules/mod_auth_basic.so

User davide
Group davide

<VirtualHost 127.0.0.1:28982>
    DocumentRoot /tmp/opencode/mitigation_1021/htdocs
    DirectoryIndex index.php

    <Directory /tmp/opencode/mitigation_1021/htdocs>
        Require all granted
        <FilesMatch \.php$>
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>

    # %P = serving prefork child pid; used to prove worker identity/survival.
    CustomLog /tmp/opencode/mitigation_1021/lanes/D_modphp/logs/access.log "%h %l %u %t \"%r\" %>s %b %D %P"

    # M1 + M2 + M3, all admin scope.
    php_admin_value session.upload_progress.enabled 0
    php_admin_value session.upload_progress.cleanup 0
    php_admin_value memory_limit 128M
    php_admin_value post_max_size 8M
    php_admin_value display_errors 0
    php_admin_value fatal_error_backtraces 0
    php_admin_flag  log_errors on
    php_admin_value error_log /tmp/opencode/mitigation_1021/lanes/D_modphp/logs/php_err.log
    php_admin_value session.save_path /tmp/opencode/mitigation_1021/lanes/D_modphp/sessions
    php_admin_value session.use_strict_mode 0
    php_admin_value session.use_only_cookies 1
    php_admin_value session.gc_probability 0
    php_admin_value upload_tmp_dir /tmp/opencode/mitigation_1021/lanes/D_modphp/tmp
    php_admin_value sys_temp_dir /tmp/opencode/mitigation_1021/lanes/D_modphp/tmp
</VirtualHost>
