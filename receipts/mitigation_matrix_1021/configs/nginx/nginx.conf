# Private nginx 1.30.1 front-end for the mitigation matrix (loopback only).
# One server block per FPM lane; upstreams are the private FPM TCP listeners.
worker_processes 1;
pid /tmp/opencode/mitigation_1021/nginx/logs/nginx.pid;
error_log /tmp/opencode/mitigation_1021/nginx/logs/error.log notice;
daemon on;

events { worker_connections 64; }

http {
    access_log /tmp/opencode/mitigation_1021/nginx/logs/access.log;
    client_body_temp_path /tmp/opencode/mitigation_1021/nginx/tmp/client;
    fastcgi_temp_path /tmp/opencode/mitigation_1021/nginx/tmp/fcgi;
    proxy_temp_path /tmp/opencode/mitigation_1021/nginx/tmp/proxy;
    client_max_body_size 64m;
    default_type text/plain;
    include /opt/nginx-1.30.1/conf/mime.types;

    # lane A control -> FPM 28980
    server {
        listen 127.0.0.1:28990;
        server_name localhost;
        root /tmp/opencode/mitigation_1021/htdocs;
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:28980;
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
    # lane B mitigated -> FPM 28981
    server {
        listen 127.0.0.1:28991;
        server_name localhost;
        root /tmp/opencode/mitigation_1021/htdocs;
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:28981;
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
    # lane C M1-only -> FPM 28983
    server {
        listen 127.0.0.1:28992;
        server_name localhost;
        root /tmp/opencode/mitigation_1021/htdocs;
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:28983;
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
    # lane B2 oversize probe, 12M limit -> FPM 28984
    server {
        listen 127.0.0.1:28993;
        server_name localhost;
        root /tmp/opencode/mitigation_1021/htdocs;
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:28984;
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
    # lane B3 oversize probe, 128M limit -> FPM 28985
    server {
        listen 127.0.0.1:28994;
        server_name localhost;
        root /tmp/opencode/mitigation_1021/htdocs;
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:28985;
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
    # lane B4 memory_limit=-1 stopgap -> FPM 28987
    server {
        listen 127.0.0.1:28995;
        server_name localhost;
        root /tmp/opencode/mitigation_1021/htdocs;
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:28987;
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
