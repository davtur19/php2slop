[global]
pid = /tmp/opencode/m4_test_1021/run/fpm.pid
error_log = /tmp/opencode/m4_test_1021/logs/fpm-master.log
log_level = notice
daemonize = yes
process_control_timeout = 10
emergency_restart_threshold = 0

[l0]
user = davide
group = davide
listen = 127.0.0.1:29030
listen.backlog = 128
pm = static
pm.max_children = 1
pm.max_requests = 0
request_terminate_timeout = 60s
access.log = /tmp/opencode/m4_test_1021/logs/l0.access.log
access.format = "%p|%d|%t|%m|%s|%{REQUEST_URI}e"
catch_workers_output = yes
php_admin_value[memory_limit] = 128M
php_admin_value[session.save_path] = /tmp/opencode/m4_test_1021/sessions/l0
php_admin_value[session.upload_progress.enabled] = 1
php_admin_value[session.upload_progress.cleanup] = 0
php_admin_value[session.upload_progress.min_freq] = 0
php_admin_value[session.use_strict_mode] = 0
php_admin_value[session.use_cookies] = 1
php_admin_value[session.use_only_cookies] = 1
php_admin_value[session.gc_probability] = 0
php_admin_value[upload_tmp_dir] = /tmp/opencode/m4_test_1021/tmp/l0
php_admin_value[sys_temp_dir] = /tmp/opencode/m4_test_1021/tmp/l0
php_admin_value[error_reporting] = -1
php_admin_value[display_errors] = 1
php_admin_value[html_errors] = 0
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /tmp/opencode/m4_test_1021/logs/php_err_l0.log
php_admin_value[max_execution_time] = 60
php_admin_value[default_socket_timeout] = 30
php_admin_value[user_ini.filename] = .user.ini
php_admin_value[user_ini.cache_ttl] = 0

