[global]
pid = /tmp/opencode/no_upload_mitigation_1021/run/php-fpm.pid
error_log = /tmp/opencode/no_upload_mitigation_1021/logs/php-fpm-master.log
daemonize = yes
log_level = notice

; ---- U0: baseline control (stock INI, memory_limit 8M) ----
[u0]
listen = /tmp/opencode/no_upload_mitigation_1021/run/fpm_u0.sock
listen.mode = 0666
pm = static
pm.max_children = 4
pm.max_requests = 500
request_terminate_timeout = 60s
catch_workers_output = yes
access.log = /tmp/opencode/no_upload_mitigation_1021/logs/fpm_u0.access.log
access.format = "pid=%p %R %m %r%Q%q -> %s %{mili}dms"
php_admin_value[memory_limit] = 8M
php_admin_value[session.save_path] = /tmp/opencode/no_upload_mitigation_1021/sessions/u0
php_admin_value[error_log] = /tmp/opencode/no_upload_mitigation_1021/logs/fpm_u0.error.log
php_admin_flag[log_errors] = on
php_admin_value[display_errors] = On

