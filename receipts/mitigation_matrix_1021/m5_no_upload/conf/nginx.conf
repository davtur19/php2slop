# /tmp/opencode/no_upload_mitigation_1021/conf/nginx.conf
# "Block uploads entirely" mitigation lanes for the PHP 8.5.10
# upload-progress / multipart-filename OOM arm.  Loopback only, 29060-29075.
worker_processes 1;
worker_rlimit_nofile 1024;
pid /tmp/opencode/no_upload_mitigation_1021/run/nginx.pid;
error_log /tmp/opencode/no_upload_mitigation_1021/logs/nginx-error.log info;

events { worker_connections 256; }

http {
    include /opt/nginx-1.30.1/conf/mime.types;
    default_type application/octet-stream;
    access_log off;
    log_format lane '$time_iso8601 port=$server_port $remote_addr "$request_method $request_uri" '
                    'status=$status sent=$body_bytes_sent req_len=$request_length '
                    'upst=$upstream_status ct=$request_time cl=$content_length '
                    'ua="$http_user_agent"';

    client_body_temp_path /tmp/opencode/no_upload_mitigation_1021/run/client_body;
    proxy_temp_path       /tmp/opencode/no_upload_mitigation_1021/run/proxy_temp;
    fastcgi_temp_path     /tmp/opencode/no_upload_mitigation_1021/run/fastcgi_temp;

    # U3 coarse: any request whose Content-Type starts with multipart/form-data.
    map $http_content_type $u3_reject {
        default 0;
        "~*^multipart/form-data" 1;
    }

    # U3b refined: same, but only for methods that can carry a request body.
    map "$request_method:$http_content_type" $u3b_reject {
        default 0;
        "~*^(POST|PUT|PATCH):multipart/form-data" 1;
    }

    # ---------------- U0 baseline control: no edge rule, PHP 8M ----------------
    server {
        listen 127.0.0.1:29060;
        server_name u0;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u0.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u0.error.log info;
        client_max_body_size 8m;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/no_upload_mitigation_1021/run/fpm_u0.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- U1: PHP file_uploads=0 (php-fpm) ----------------
    server {
        listen 127.0.0.1:29061;
        server_name u1;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u1.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u1.error.log info;
        client_max_body_size 8m;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/no_upload_mitigation_1021/run/fpm_u1.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- U2: PHP enable_post_data_reading=0 ----------------
    server {
        listen 127.0.0.1:29062;
        server_name u2;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u2.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u2.error.log info;
        client_max_body_size 8m;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/no_upload_mitigation_1021/run/fpm_u2.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- U3: edge rejects multipart (coarse) ----------------
    server {
        listen 127.0.0.1:29063;
        server_name u3;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u3.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u3.error.log info;
        client_max_body_size 8m;         # deliberately NOT the blocker: 415 must fire
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            if ($u3_reject) { return 415; }
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/no_upload_mitigation_1021/run/fpm_u3.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- U4: client_max_body_size 128k alone ----------------
    server {
        listen 127.0.0.1:29064;
        server_name u4;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u4.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u4.error.log info;
        client_max_body_size 128k;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/no_upload_mitigation_1021/run/fpm_u4.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- U5: PHP max_file_uploads=0 ----------------
    server {
        listen 127.0.0.1:29065;
        server_name u5;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u5.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u5.error.log info;
        client_max_body_size 8m;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/no_upload_mitigation_1021/run/fpm_u5.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- U6: PHP post_max_size=0 (semantics) ----------------
    server {
        listen 127.0.0.1:29066;
        server_name u6;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u6.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u6.error.log info;
        client_max_body_size 8m;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/no_upload_mitigation_1021/run/fpm_u6.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- U1b: PHP file_uploads=0 via php-cgi (TCP 29074) ----------------
    server {
        listen 127.0.0.1:29067;
        server_name u1cgi;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u1cgi.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u1cgi.error.log info;
        client_max_body_size 8m;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass 127.0.0.1:29074;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # ---------------- U3b: refined edge rule (POST/PUT/PATCH multipart only) ----------------
    server {
        listen 127.0.0.1:29068;
        server_name u3b;
        root /tmp/opencode/no_upload_mitigation_1021/docroot;
        access_log /tmp/opencode/no_upload_mitigation_1021/logs/u3b.access.log lane;
        error_log  /tmp/opencode/no_upload_mitigation_1021/logs/u3b.error.log info;
        client_max_body_size 8m;
        client_body_buffer_size 128k;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ \.php$ {
            if ($u3b_reject) { return 415; }
            include /opt/nginx-1.30.1/conf/fastcgi_params;
            fastcgi_pass unix:/tmp/opencode/no_upload_mitigation_1021/run/fpm_u3b.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }
}
