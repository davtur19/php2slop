# ---- WordPress recommended nginx config (developer.wordpress.org) ----
server {
    listen 8002;
    server_name _;
    root /var/www/wordpress;
    index index.php;

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi.conf;
        fastcgi_intercept_errors on;
        fastcgi_pass t11043-fpm739;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
        expires max;
        log_not_found off;
    }
}


# ---- MediaWiki recommended nginx config (mediawiki.org Manual:Short URL/Nginx) ----
server {
    listen 8003;
    server_name _;
    root /var/www;

    location ~ ^/w/(mw-config/)?(index|load|api|thumb|opensearch_desc|rest|img_auth)\.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass t11043-fpm739;
    }

    location /w/images {
        add_header X-Content-Type-Options "nosniff";
        types { text/plain html htm shtml phtml; }
    }
    location /w/images/deleted {
        deny all;
    }
    location ~ ^/w/resources/(assets|lib|src) {
        try_files $uri =404;
        add_header Cache-Control "public";
        expires 7d;
    }
    location ~ ^/w/(skins|extensions)/.+\.(css|js|gif|jpg|jpeg|png|svg|wasm|ttf|woff|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public";
        expires 7d;
    }
    location = /favicon.ico {
        alias /w/images/6/64/Favicon.ico;
        add_header Cache-Control "public";
        expires 7d;
    }
    location ~ ^/w/(COPYING|CREDITS)$ {
        default_type text/plain;
    }
    location /w/rest.php/ {
        try_files $uri $uri/ /w/rest.php?$query_string;
    }
    location /wiki/ {
        rewrite ^/wiki/(?<pagename>.*)$ /w/index.php;
    }
    location = /robots.txt {
    }
    location = / {
        return 301 /wiki/Main_Page;
    }
    location / {
        return 404;
    }
}


