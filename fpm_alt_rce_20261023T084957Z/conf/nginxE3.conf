# E3: PATH_INFO assigned from $fastcgi_path_info but NO fastcgi_split_path_info
server {
    listen 8124;
    server_name _;
    root /srv/www/7223;
    index index.php;
    location ~ [^/]\.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass fpmalt-7223-e3:9000;
    }
}
