[global]
pid = /tmp/opencode/research/mw_109619_20261023T010708Z/fpm8511/fpm.pid
error_log = /tmp/opencode/research/mw_109619_20261023T010708Z/fpm8511/fpm-error.log
log_level = notice
daemonize = no
process_control_timeout = 10s

[www]
user = davide
group = davide
listen = 127.0.0.1:18750
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 0

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

access.log = /tmp/opencode/research/mw_109619_20261023T010708Z/fpm8511/fpm-access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

php_admin_value[error_log] = /tmp/opencode/research/mw_109619_20261023T010708Z/fpm8511/php-error.log
php_admin_flag[log_errors] = on
php_admin_value[display_errors] = Off
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[error_reporting] = 32767
php_admin_value[session.save_path] = /tmp/opencode/research/mw_109619_20261023T010708Z/fpm8511/sessions

pm.status_path = /fpm-status
ping.path = /fpm-ping
