# Observation-only logging delta for the replication kit.
# The stock MPM and php.ini are not modified.  This defines the %P child-PID
# log format; conf/000-default.conf adds it as a SECOND access log so the
# stock combined log is retained.  It is not part of the exploit path.
LogFormat "%P %{%s}t.%{usec_frac}t %m %U %>s %b %D" p2s
