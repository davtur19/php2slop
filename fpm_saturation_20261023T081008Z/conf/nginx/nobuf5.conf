user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    client_body_temp_path /var/cache/nginx/client_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    sendfile on;
    keepalive_timeout 65;
    upstream fpm       { server fsat-fpm5:9000; }
    upstream fpmstatus { server fsat-fpm5:9001; }
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;
        location / { try_files $uri $uri/ =404; }
        location ~ [^/]\.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            client_max_body_size 64m;
            fastcgi_request_buffering off;
            fastcgi_pass fpm;
            fastcgi_read_timeout 300;
        }
    }
    server {
        listen 8081;
        location = /status {
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /status;
            fastcgi_param SCRIPT_FILENAME /status;
            fastcgi_param REQUEST_URI /status;
            fastcgi_pass fpmstatus;
        }
        location = /ping {
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /ping;
            fastcgi_param SCRIPT_FILENAME /ping;
            fastcgi_param REQUEST_URI /ping;
            fastcgi_pass fpmstatus;
        }
    }
    server {
        listen 8082;
        location = /status {
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /status;
            fastcgi_param SCRIPT_FILENAME /status;
            fastcgi_param REQUEST_URI /status;
            fastcgi_pass fpm;
        }
    }
}
